name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run Lighthouse performance tests
        run: |
          npx lighthouse http://localhost:3000 --emulated-form-factor=mobile --only-categories=performance
          npx lighthouse http://localhost:3000 --emulated-form-factor=desktop --only-categories=performance
          npx lighthouse http://localhost:3000 --emulated-form-factor=tablet --only-categories=performance

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: npm run deploy
